name: Temporary Spawn Zone Configurator

on:
  push:
    branches:
      - fix/enemy-spawn-zone-config

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enemy-spawn-zone-config
          fetch-depth: 1

      - name: Configure EnemySpawnZone2D scene references and safe defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          SCENE = Path('Hero/Assets/Scenes/SampleScene.unity')
          ZONE_GUID = 'a29ad8ce999b4f2e9ddd114f7fd7e705'
          DIRECTOR_GUID = '9e054ba2f378401ba135e5b0e6edb8be'
          STREAM_TARGET_GUID = '6534396e58c446c88ad4049e0a59b7cf'

          text = SCENE.read_text(encoding='utf-8')
          marker = re.compile(r'^--- !u!(\d+) &(-?\d+)(?: stripped)?\s*$', re.M)
          matches = list(marker.finditer(text))
          if not matches:
              raise SystemExit('Unity scene has no YAML object blocks.')

          prefix = text[:matches[0].start()]
          blocks = []
          for i, m in enumerate(matches):
              end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
              blocks.append({
                  'class_id': int(m.group(1)),
                  'file_id': m.group(2),
                  'text': text[m.start():end]
              })

          def rebuild_index():
              return {b['file_id']: i for i, b in enumerate(blocks)}

          def ref(block_text, key):
              m = re.search(r'^\s*' + re.escape(key) + r':\s*\{fileID:\s*(-?\d+)', block_text, re.M)
              return m.group(1) if m else None

          def go_name(block_text):
              m = re.search(r'^\s*m_Name:\s*(.*)$', block_text, re.M)
              return m.group(1).strip() if m else None

          def script_guid(block_text):
              m = re.search(r'm_Script:\s*\{fileID:\s*\d+,\s*guid:\s*([0-9a-f]+)', block_text)
              return m.group(1) if m else None

          def set_scalar(block_text, key, value):
              pat = re.compile(r'^(\s*' + re.escape(key) + r':\s*).+$', re.M)
              new_text, count = pat.subn(lambda m: m.group(1) + str(value), block_text, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not set {key}')
              return new_text

          def set_layer_mask(block_text, key, bits):
              pat = re.compile(
                  r'(^\s*' + re.escape(key) + r':\s*\n'
                  r'\s*serializedVersion:\s*2\s*\n'
                  r'\s*m_Bits:\s*)\d+', re.M)
              new_text, count = pat.subn(lambda m: m.group(1) + str(bits), block_text, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not set mask {key}')
              return new_text

          # Locate the regional spawn zone component.
          zone_idx = next((i for i, b in enumerate(blocks)
                           if b['class_id'] == 114 and script_guid(b['text']) == ZONE_GUID), None)
          if zone_idx is None:
              raise SystemExit('EnemySpawnZone2D component was not found in SampleScene.')

          zone_go_id = ref(blocks[zone_idx]['text'], 'm_GameObject')
          if not zone_go_id:
              raise SystemExit('EnemySpawnZone2D has no GameObject reference.')

          zone_transform_idx = next((i for i, b in enumerate(blocks)
                                     if b['class_id'] == 4 and ref(b['text'], 'm_GameObject') == zone_go_id), None)
          if zone_transform_idx is None:
              raise SystemExit('EnemySpawnZone2D GameObject Transform was not found.')
          zone_transform_id = blocks[zone_transform_idx]['file_id']

          # Validate the director is already the correct RegionalSpawnDirector.
          director_ids = [b['file_id'] for b in blocks
                          if b['class_id'] == 114 and script_guid(b['text']) == DIRECTOR_GUID]
          if len(director_ids) != 1:
              raise SystemExit(f'Expected exactly one RegionalSpawnDirector, found {len(director_ids)}.')
          director_id = director_ids[0]
          if ref(blocks[zone_idx]['text'], 'director') != director_id:
              blocks[zone_idx]['text'] = set_scalar(
                  blocks[zone_idx]['text'], 'director', f'{{fileID: {director_id}}}')

          # Find the Main Camera component and make the zone reference it explicitly.
          main_camera_go_id = next((b['file_id'] for b in blocks
                                    if b['class_id'] == 1 and go_name(b['text']) == 'Main Camera'), None)
          if not main_camera_go_id:
              raise SystemExit('Main Camera GameObject was not found.')
          camera_id = next((b['file_id'] for b in blocks
                            if b['class_id'] == 20 and ref(b['text'], 'm_GameObject') == main_camera_go_id), None)
          if not camera_id:
              raise SystemExit('Camera component on Main Camera was not found.')
          blocks[zone_idx]['text'] = set_scalar(
              blocks[zone_idx]['text'], 'localObserverCamera', f'{{fileID: {camera_id}}}')

          # Use the safe intended defaults from EnemySpawnZone2D / RegionalSpawnSetupEditor.
          z = blocks[zone_idx]['text']
          z = set_scalar(z, 'initialSpawnDelay', '0.5')
          z = set_scalar(z, 'minimumRespawnTime', '8')
          z = set_scalar(z, 'maximumRespawnTime', '14')
          z = set_scalar(z, 'failedPointRetryTime', '1.5')
          z = set_scalar(z, 'minimumDistanceFromPlayers', '7')
          z = set_scalar(z, 'maximumDistanceFromPlayers', '28')
          z = set_scalar(z, 'requireOffscreen', '1')
          z = set_scalar(z, 'offscreenPadding', '1.25')
          z = set_scalar(z, 'requireAllowedGround', '0')
          z = set_layer_mask(z, 'allowedGroundLayers', 0)
          z = set_scalar(z, 'allowTriggerGround', '1')
          z = set_layer_mask(z, 'blockedEnvironmentLayers', 128)
          z = set_scalar(z, 'enemyClearanceRadius', '0.5')
          z = set_scalar(z, 'blockedTriggersCount', '0')
          z = set_scalar(z, 'spawnPointSearchAttempts', '32')
          blocks[zone_idx]['text'] = z

          # Ensure the assigned spawn-area collider is a trigger.
          spawn_area_id = ref(z, 'spawnArea')
          by_id = rebuild_index()
          if not spawn_area_id or spawn_area_id not in by_id:
              raise SystemExit('Assigned Spawn Area collider was not found.')
          spawn_idx = by_id[spawn_area_id]
          if 'm_IsTrigger:' in blocks[spawn_idx]['text']:
              blocks[spawn_idx]['text'] = set_scalar(blocks[spawn_idx]['text'], 'm_IsTrigger', '1')

          # Allocate stable unused local file IDs for any components/objects we add.
          used = {int(b['file_id']) for b in blocks if b['file_id'].lstrip('-').isdigit()}
          next_id = 2100000000
          def alloc_id():
              nonlocal_box = None
              global next_id
              while next_id in used:
                  next_id -= 1
              value = next_id
              used.add(value)
              next_id -= 1
              return str(value)

          # Add the required WorldStreamingTarget to Player if it is missing.
          stream_targets = [b for b in blocks
                            if b['class_id'] == 114 and script_guid(b['text']) == STREAM_TARGET_GUID]
          added_stream_target = False
          if not stream_targets:
              player_idx = next((i for i, b in enumerate(blocks)
                                 if b['class_id'] == 1 and go_name(b['text']) == 'Player'), None)
              if player_idx is None:
                  raise SystemExit('Player GameObject was not found.')
              player_go_id = blocks[player_idx]['file_id']
              target_id = alloc_id()

              # Add the component reference after the existing component list.
              ptxt = blocks[player_idx]['text']
              comp_match = re.search(r'(  m_Component:\s*\n(?:  - component: \{fileID: -?\d+\}\s*\n)+)', ptxt)
              if not comp_match:
                  raise SystemExit('Player m_Component list could not be parsed.')
              new_comp_list = comp_match.group(1) + f'  - component: {{fileID: {target_id}}}\n'
              blocks[player_idx]['text'] = ptxt[:comp_match.start()] + new_comp_list + ptxt[comp_match.end():]

              target_block = f'''--- !u!114 &{target_id}\nMonoBehaviour:\n  m_ObjectHideFlags: 0\n  m_CorrespondingSourceObject: {{fileID: 0}}\n  m_PrefabInstance: {{fileID: 0}}\n  m_PrefabAsset: {{fileID: 0}}\n  m_GameObject: {{fileID: {player_go_id}}}\n  m_Enabled: 1\n  m_EditorHideFlags: 0\n  m_Script: {{fileID: 11500000, guid: {STREAM_TARGET_GUID}, type: 3}}\n  m_Name: \n  m_EditorClassIdentifier: \n  affectsPresentation: 1\n  affectsSimulation: 1\n'''
              scene_roots_idx = next((i for i, b in enumerate(blocks) if b['class_id'] == 1660057539), len(blocks))
              blocks.insert(scene_roots_idx, {'class_id': 114, 'file_id': target_id, 'text': target_block})
              added_stream_target = True

          # Create and assign a dedicated DynamicEnemies child if the field is empty.
          z = blocks[zone_idx]['text']
          dynamic_ref = ref(z, 'dynamicEnemiesRoot')
          added_dynamic_root = False
          if not dynamic_ref or dynamic_ref == '0':
              dynamic_go_id = alloc_id()
              dynamic_transform_id = alloc_id()

              dynamic_go = f'''--- !u!1 &{dynamic_go_id}\nGameObject:\n  m_ObjectHideFlags: 0\n  m_CorrespondingSourceObject: {{fileID: 0}}\n  m_PrefabInstance: {{fileID: 0}}\n  m_PrefabAsset: {{fileID: 0}}\n  serializedVersion: 6\n  m_Component:\n  - component: {{fileID: {dynamic_transform_id}}}\n  m_Layer: 0\n  m_Name: DynamicEnemies\n  m_TagString: Untagged\n  m_Icon: {{fileID: 0}}\n  m_NavMeshLayer: 0\n  m_StaticEditorFlags: 0\n  m_IsActive: 1\n'''
              dynamic_transform = f'''--- !u!4 &{dynamic_transform_id}\nTransform:\n  m_ObjectHideFlags: 0\n  m_CorrespondingSourceObject: {{fileID: 0}}\n  m_PrefabInstance: {{fileID: 0}}\n  m_PrefabAsset: {{fileID: 0}}\n  m_GameObject: {{fileID: {dynamic_go_id}}}\n  serializedVersion: 2\n  m_LocalRotation: {{x: 0, y: 0, z: 0, w: 1}}\n  m_LocalPosition: {{x: 0, y: 0, z: 0}}\n  m_LocalScale: {{x: 1, y: 1, z: 1}}\n  m_ConstrainProportionsScale: 0\n  m_Children: []\n  m_Father: {{fileID: {zone_transform_id}}}\n  m_LocalEulerAnglesHint: {{x: 0, y: 0, z: 0}}\n'''

              # Register the new child on the zone Transform.
              zt = blocks[zone_transform_idx]['text']
              if re.search(r'^  m_Children: \[\]\s*$', zt, re.M):
                  zt = re.sub(r'^  m_Children: \[\]\s*$',
                              f'  m_Children:\n  - {{fileID: {dynamic_transform_id}}}', zt, count=1, flags=re.M)
              else:
                  cm = re.search(r'(^  m_Children:\s*\n(?:  - \{fileID: -?\d+\}\s*\n)*)', zt, re.M)
                  if not cm:
                      raise SystemExit('Zone Transform m_Children could not be parsed.')
                  children = cm.group(1) + f'  - {{fileID: {dynamic_transform_id}}}\n'
                  zt = zt[:cm.start()] + children + zt[cm.end():]
              blocks[zone_transform_idx]['text'] = zt

              # Assign the Transform to Dynamic Enemies Root in the Inspector data.
              blocks[zone_idx]['text'] = set_scalar(
                  blocks[zone_idx]['text'], 'dynamicEnemiesRoot', f'{{fileID: {dynamic_transform_id}}}')

              scene_roots_idx = next((i for i, b in enumerate(blocks) if b['class_id'] == 1660057539), len(blocks))
              blocks.insert(scene_roots_idx, {'class_id': 1, 'file_id': dynamic_go_id, 'text': dynamic_go})
              blocks.insert(scene_roots_idx + 1, {'class_id': 4, 'file_id': dynamic_transform_id, 'text': dynamic_transform})
              added_dynamic_root = True

          # Rebuild and save the scene without touching gameplay source code.
          new_text = prefix + ''.join(b['text'] for b in blocks)
          SCENE.write_text(new_text, encoding='utf-8')

          # Small temporary verification report; removed after verification by the assistant.
          final_zone = blocks[zone_idx]['text']
          report = [
              'ENEMY SPAWN ZONE CONFIGURATION APPLIED',
              f'zoneGameObjectFileID={zone_go_id}',
              f'directorFileID={director_id}',
              f'cameraFileID={camera_id}',
              f'spawnAreaFileID={spawn_area_id}',
              f'addedWorldStreamingTarget={added_stream_target}',
              f'addedDynamicEnemiesRoot={added_dynamic_root}',
              '',
              '=== EnemySpawnZone2D ===',
              final_zone,
          ]
          Path('.spawn-zone-inspection.txt').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Commit configured scene
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hero/Assets/Scenes/SampleScene.unity .spawn-zone-inspection.txt
          git commit -m "fix: configure EnemySpawnZone2D scene setup" || exit 0
          git push origin HEAD:fix/enemy-spawn-zone-config
