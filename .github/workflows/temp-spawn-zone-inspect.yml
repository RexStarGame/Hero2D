name: Temporary Spawn Zone Inspector

on:
  push:
    branches:
      - fix/enemy-spawn-zone-setup

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enemy-spawn-zone-setup
          fetch-depth: 1

      - name: Inspect Unity scene setup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root = Path('.')
          scene_path = root / 'Hero/Assets/Scenes/SampleScene.unity'
          text = scene_path.read_text(encoding='utf-8')

          # Map MonoBehaviour script GUIDs back to source paths.
          guid_to_script = {}
          for meta in (root / 'Hero/Assets').rglob('*.cs.meta'):
              try:
                  mt = meta.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              m = re.search(r'^guid:\s*([0-9a-f]+)', mt, re.M)
              if m:
                  guid_to_script[m.group(1)] = str(meta)[:-5]

          blocks = []
          pattern = re.compile(r'^--- !u!(\d+) &(-?\d+)\s*$', re.M)
          matches = list(pattern.finditer(text))
          for i, m in enumerate(matches):
              start = m.start()
              end = matches[i+1].start() if i + 1 < len(matches) else len(text)
              blocks.append({
                  'class': int(m.group(1)),
                  'id': m.group(2),
                  'text': text[start:end].rstrip()
              })

          by_id = {b['id']: b for b in blocks}

          def field(block_text, key):
              m = re.search(r'^\s*' + re.escape(key) + r':\s*(.*)$', block_text, re.M)
              return m.group(1).strip() if m else None

          def ref_id(value):
              if not value:
                  return None
              m = re.search(r'fileID:\s*(-?\d+)', value)
              return m.group(1) if m else None

          gameobjects = {}
          for b in blocks:
              if b['class'] != 1:
                  continue
              name = field(b['text'], 'm_Name')
              layer = field(b['text'], 'm_Layer')
              tag = field(b['text'], 'm_TagString')
              comps = re.findall(r'- component: \{fileID: (-?\d+)\}', b['text'])
              gameobjects[b['id']] = {'name': name, 'layer': layer, 'tag': tag, 'components': comps}

          monobehaviours = []
          for b in blocks:
              if b['class'] != 114:
                  continue
              go = ref_id(field(b['text'], 'm_GameObject'))
              sm = re.search(r'm_Script:\s*\{fileID:\s*\d+,\s*guid:\s*([0-9a-f]+)', b['text'])
              guid = sm.group(1) if sm else None
              monobehaviours.append({
                  'id': b['id'], 'go': go, 'go_name': gameobjects.get(go, {}).get('name'),
                  'script_guid': guid, 'script_path': guid_to_script.get(guid), 'raw': b['text']
              })

          # Find all relevant objects/components.
          zone_mbs = [m for m in monobehaviours if m['script_path'] and m['script_path'].endswith('/EnemySpawnZone2D.cs')]
          director_mbs = [m for m in monobehaviours if m['script_path'] and m['script_path'].endswith('/RegionalSpawnDirector.cs')]
          streaming_mbs = [m for m in monobehaviours if m['script_path'] and 'WorldStreamingTarget' in Path(m['script_path']).name]
          player_mbs = [m for m in monobehaviours if (m['go_name'] or '').lower() == 'player']

          # Components attached to named objects, with Unity class IDs and source paths when possible.
          def describe_go(go_id):
              go = gameobjects.get(go_id)
              if not go:
                  return None
              out = dict(go)
              out['fileID'] = go_id
              out['component_details'] = []
              for cid in go['components']:
                  cb = by_id.get(cid)
                  item = {'fileID': cid, 'classID': cb['class'] if cb else None}
                  if cb and cb['class'] == 114:
                      sm = re.search(r'm_Script:\s*\{fileID:\s*\d+,\s*guid:\s*([0-9a-f]+)', cb['text'])
                      guid = sm.group(1) if sm else None
                      item['script_guid'] = guid
                      item['script_path'] = guid_to_script.get(guid)
                  out['component_details'].append(item)
              return out

          named = {}
          for go_id, go in gameobjects.items():
              if go['name'] in {'Player','Main Camera','RegionalSpawnDirector','EnemyLevel-1Zone','ArmyEnemyZones','DynamicEnemies'} or (go['name'] and 'DynamicEnemies' in go['name']):
                  named.setdefault(go['name'], []).append(describe_go(go_id))

          report = []
          report.append('TEMP UNITY SPAWN ZONE INSPECTION')
          report.append('Scene: Hero/Assets/Scenes/SampleScene.unity')
          report.append('')
          report.append('=== Named GameObjects ===')
          report.append(json.dumps(named, indent=2, ensure_ascii=False))
          report.append('')
          report.append('=== EnemySpawnZone2D MonoBehaviours ===')
          for m in zone_mbs:
              report.append(f"GO={m['go_name']} componentFileID={m['id']} script={m['script_path']}")
              report.append(m['raw'])
              report.append('')
          report.append('=== RegionalSpawnDirector MonoBehaviours ===')
          for m in director_mbs:
              report.append(f"GO={m['go_name']} componentFileID={m['id']} script={m['script_path']}")
              report.append(m['raw'])
              report.append('')
          report.append('=== WorldStreamingTarget MonoBehaviours ===')
          for m in streaming_mbs:
              report.append(f"GO={m['go_name']} componentFileID={m['id']} script={m['script_path']}")
              report.append(m['raw'])
              report.append('')
          report.append('=== Player MonoBehaviours ===')
          for m in player_mbs:
              report.append(f"componentFileID={m['id']} script={m['script_path']} guid={m['script_guid']}")
          report.append('')
          report.append('=== Source files containing WorldStreamingTarget ===')
          for cs in (root / 'Hero/Assets').rglob('*.cs'):
              try:
                  s = cs.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if 'WorldStreamingTarget' in s:
                  report.append(str(cs))

          Path('.spawn-zone-inspection.txt').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Commit temporary inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .spawn-zone-inspection.txt
          git commit -m "chore: inspect EnemySpawnZone2D scene setup" || exit 0
          git push origin HEAD:fix/enemy-spawn-zone-setup
